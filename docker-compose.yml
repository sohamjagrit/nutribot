services:
  nutribot:
    image: ${NUTRIBOT_IMAGE:-nutribot-nutribot}  # EC2 sets this to the ECR tag; local builds keep the default name
    build:
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-dev}
    ports:
      - "80:8000"
    env_file: .env
    environment:
      MCP_NUTRITION_URL: http://opennutrition:3000/mcp
    volumes:
      - nutribot-data:/app/data
    depends_on:
      - opennutrition
    restart: unless-stopped
    networks: [internal]

  # Food lookup MCP server. No auth, so NO `ports:` -- reachable only on the private network.
  opennutrition:
    image: deadletterq/mcp-opennutrition@sha256:e7a9a8747741eeff3b9d647042fda04476a6ab4f632bb50df40d663a4ea9abd8
    environment:
      PORT: "3000"  # source defaults to 9113 otherwise
    restart: unless-stopped
    networks: [internal]

volumes:
  nutribot-data:

networks:
  internal:
