[project]
name = "nutribot"
version = "0.1.0"
description = "NutriBot — RAG Chatbot for Nutrition Q&A"
authors = [{name = "Soham", email = "sohamjagrit@gmail.com"}]
requires-python = ">=3.10"
dependencies = [
    # LangGraph + LLM
    "langgraph>=0.2.0",
    "langchain-groq>=0.1.0",
    "langchain-core>=0.1.0",
    # Vector store
    "pinecone>=3.0.0",
    # Embeddings
    "sentence-transformers>=3.0.0",
    "torch>=2.0.0",
    # Web framework
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    # Config
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "numpy>=1.24.0",
    "langsmith>=0.8.15",
]

# CPU-only PyTorch on Linux to avoid pulling CUDA wheels (~6 GB)
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

[project.optional-dependencies]
dev = [
    "ruff>=0.9.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
]

notebooks = [
    "jupyter>=1.0.0",
    "jupyterlab>=4.0.0",
    "pandas>=2.2.0",
    "matplotlib>=3.9.0",
    "ragas>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
