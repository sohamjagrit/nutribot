name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: nutrition-chatbot
  ECS_SERVICE: nutribot-staging

jobs:
  # ============ LINT & FORMAT CHECK ============
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync

      - name: Ruff lint
        run: uv run ruff check .

      - name: Black format check
        run: uv run black --check .

      - name: Mypy type check
        run: uv run mypy src/

  # ============ UNIT TESTS ============
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync

      - name: Run pytest
        run: uv run pytest -v --cov=src --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          flags: unittests
          fail_ci_if_error: false

  # ============ BUILD & PUSH TO ECR ============
  build:
    name: Build & Push to ECR
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to ECR
        id: image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Print image URI
        run: echo "Built image: ${{ steps.image.outputs.image }}"

  # ============ DEPLOY TO STAGING ============
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to staging EC2
        env:
          STAGING_EC2_HOST: ${{ secrets.STAGING_EC2_HOST }}
          STAGING_EC2_USER: ${{ secrets.STAGING_EC2_USER }}
          STAGING_EC2_KEY: ${{ secrets.STAGING_EC2_PRIVATE_KEY }}
          ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
        run: |
          mkdir -p ~/.ssh
          echo "$STAGING_EC2_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H $STAGING_EC2_HOST >> ~/.ssh/known_hosts 2>/dev/null || true

          ssh -i ~/.ssh/deploy_key $STAGING_EC2_USER@$STAGING_EC2_HOST << 'EOF'
          #!/bin/bash
          set -e
          cd /app/nutribot
          aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin $ECR_REGISTRY
          docker pull $ECR_REGISTRY/nutrition-chatbot:latest
          docker stop nutribot-staging || true
          docker rm nutribot-staging || true
          docker run -d \
            --name nutribot-staging \
            -p 8001:8000 \
            --restart unless-stopped \
            --env-file .env.staging \
            $ECR_REGISTRY/nutrition-chatbot:latest
          echo "Waiting for health check..."
          sleep 15
          curl -f http://localhost:8001/health || (docker logs nutribot-staging --tail 50 && exit 1)
          docker image prune -f
          echo "Staging deployment complete"
          EOF

      - name: Notify deployment
        if: success()
        run: echo "✅ Deployed to staging successfully"

  # ============ MANUAL DEPLOYMENT TO PRODUCTION ============
  deploy-production:
    name: Deploy to Production (Manual)
    runs-on: ubuntu-latest
    needs: [build, deploy-staging]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://nutribot.example.com
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to production EC2
        env:
          PROD_EC2_HOST: ${{ secrets.PROD_EC2_HOST }}
          PROD_EC2_USER: ${{ secrets.PROD_EC2_USER }}
          PROD_EC2_KEY: ${{ secrets.PROD_EC2_PRIVATE_KEY }}
          ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
        run: |
          mkdir -p ~/.ssh
          echo "$PROD_EC2_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H $PROD_EC2_HOST >> ~/.ssh/known_hosts 2>/dev/null || true

          ssh -i ~/.ssh/deploy_key $PROD_EC2_USER@$PROD_EC2_HOST << 'EOF'
          #!/bin/bash
          set -e
          cd /app/nutribot
          aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin $ECR_REGISTRY
          docker pull $ECR_REGISTRY/nutrition-chatbot:latest
          docker stop nutribot-prod || true
          docker rm nutribot-prod || true
          docker run -d \
            --name nutribot-prod \
            -p 8000:8000 \
            --restart unless-stopped \
            --env-file .env.prod \
            $ECR_REGISTRY/nutrition-chatbot:latest
          echo "Waiting for health check..."
          sleep 15
          curl -f http://localhost:8000/health || (docker logs nutribot-prod --tail 50 && exit 1)
          docker image prune -f
          echo "Production deployment complete"
          EOF

      - name: Notify deployment
        if: success()
        run: echo "✅ Deployed to production successfully"
