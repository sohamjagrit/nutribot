name: deploy
# After ci passes on main: build -> ECR -> EC2 (via SSM) -> /health check -> rollback on failure.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write   # OIDC to AWS, no long-lived keys
  contents: read

concurrency: deploy   # one deploy at a time

env:
  AWS_REGION: us-east-1
  ECR_REPO: nutrition-chatbot

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push
        id: image
        run: |
          SHA=$(git rev-parse --short HEAD)
          IMAGE="${{ steps.ecr.outputs.registry }}/${ECR_REPO}:${SHA}"
          docker build --build-arg GIT_SHA="$SHA" -t "$IMAGE" .
          docker push "$IMAGE"
          echo "ref=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Make sure the instance is running
        run: |
          ID=${{ vars.EC2_INSTANCE_ID }}
          aws ec2 start-instances --instance-ids "$ID" >/dev/null
          aws ec2 wait instance-running --instance-ids "$ID"
          for _ in $(seq 1 30); do   # wait for the SSM agent to register
            [ "$(aws ssm describe-instance-information --filters Key=InstanceIds,Values=$ID \
              --query 'InstanceInformationList[0].PingStatus' --output text)" = Online ] && exit 0
            sleep 10
          done
          echo "SSM agent never came online" >&2; exit 1

      - name: Deploy on EC2
        run: |
          B64() { base64 -w0 "$1"; }
          CMDS=$(jq -n \
            --arg c "$(B64 docker-compose.yml)" --arg a "$(B64 docker-compose.aws.yml)" \
            --arg s "$(B64 deploy/deploy.sh)" --arg img "${{ steps.image.outputs.ref }}" \
            '[ "set -e", "mkdir -p /opt/nutribot && cd /opt/nutribot",
               "echo \($c) | base64 -d > docker-compose.yml",
               "echo \($a) | base64 -d > docker-compose.aws.yml",
               "echo \($s) | base64 -d > deploy.sh",
               "bash deploy.sh \($img)" ]')
          CID=$(aws ssm send-command --instance-ids "${{ vars.EC2_INSTANCE_ID }}" \
            --document-name AWS-RunShellScript --timeout-seconds 600 \
            --parameters "commands=$CMDS" --query Command.CommandId --output text)
          aws ssm wait command-executed --command-id "$CID" --instance-id "${{ vars.EC2_INSTANCE_ID }}" || true
          aws ssm get-command-invocation --command-id "$CID" --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
            --query '[Status,StandardOutputContent,StandardErrorContent]' --output text
          [ "$(aws ssm get-command-invocation --command-id "$CID" --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
            --query Status --output text)" = Success ]
