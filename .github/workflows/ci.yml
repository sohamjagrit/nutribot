name: ci
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Tests mock external services; dummies keep module imports happy.
      ANTHROPIC_API_KEY: test
      PINECONE_API_KEY: test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen --extra dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
      - run: docker build -t nutribot-ci .

  retrieval-eval:
    # Needs the Pinecone key, which fork PRs do not get.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-bge-minilm-v1
      - run: uv sync --frozen
      - name: Retrieval eval (no LLM calls)
        env:
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          ANTHROPIC_API_KEY: test
        run: uv run python eval/run_eval.py run --tag ci_retrieval --retrieval-only
      - name: Gate vs committed baseline
        run: uv run python eval/run_eval.py gate retrieval eval/results/baseline_retrieval.json eval/results/ci_retrieval.json
